# ==============================================================================
# StockOrchestra - SealedSecret Örneği
# ==============================================================================
# Örnek: JWT Secret için SealedSecret oluşturma
#
# 1. Normal Secret oluştur:
#    kubectl create secret generic stockorchestra-secrets \
#      --namespace=stockorchestra \
#      --from-literal=jwt-secret-key='your_32_char_minimum_secret_key' \
#      --from-literal=postgres-password='strong_password' \
#      --from-literal=redis-password='strong_password' \
#      --dry-run=client -o yaml > original-secret.yaml
#
# 2. SealedSecret'e dönüştür:
#    kubeseal --format=yaml < original-secret.yaml > sealed-secret.yaml
#
# 3. Cluster'a uygula:
#    kubectl apply -f sealed-secret.yaml
# ==============================================================================

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: stockorchestra-secrets
  namespace: stockorchestra
spec:
  encryptedData:
    jwt-secret-key: AgByX...
    postgres-password: AgByX...
    redis-password: AgByX...
  template:
    metadata:
      name: stockorchestra-secrets
      namespace: stockorchestra
      labels:
        app: stockorchestra
    type: Opaque